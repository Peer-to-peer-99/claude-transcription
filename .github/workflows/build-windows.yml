name: Build Claude Audiencia - Windows

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-main
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ======================================
      # 1. CHECKOUT
      # ======================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================
      # 2. PYTHON
      # ======================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller==6.22.3 pytest

      # ======================================
      # 3. TESTES PYTHON
      # ======================================

      - name: Run Python tests
        run: python -m pytest

      # ======================================
      # 4. BUILD PYTHON
      # ======================================

      - name: Build transcription executable
        run: pyinstaller --clean --noconfirm audiencia.spec

      # ======================================
      # 5. PREPARAR RECURSOS TAURI
      # ======================================

      - name: Prepare Tauri resources
        shell: pwsh
        run: |
          $Source = "dist/audiencia"
          $Destination = "desktop/src-tauri/resources/audiencia"

          if (!(Test-Path "$Source/audiencia.exe")) {
            throw "audiencia.exe não foi gerado."
          }

          if (Test-Path $Destination) {
            Remove-Item $Destination -Recurse -Force
          }

          New-Item -ItemType Directory -Path $Destination -Force | Out-Null

          Copy-Item "$Source/*" $Destination -Recurse -Force

          if (!(Test-Path "$Destination/audiencia.exe")) {
            throw "Falha ao copiar audiencia.exe."
          }

      # ======================================
      # 6. DEFINIR VERSÃO DA RELEASE
      # ======================================

      - name: Set next release version
        shell: pwsh
        run: |
          $ConfigPath = "desktop/src-tauri/tauri.conf.json"
          $PackagePath = "desktop/package.json"
          $PackageLockPath = "desktop/package-lock.json"
          $Config = Get-Content $ConfigPath -Raw | ConvertFrom-Json
          $CurrentVersion = [version]$Config.version
          $LatestTag = git tag --list "app-v*" --sort=-version:refname |
            Select-Object -First 1

          $BaseVersion = $CurrentVersion
          if ($LatestTag -match '^app-v(\d+\.\d+\.\d+)$') {
            $TaggedVersion = [version]$Matches[1]
            if ($TaggedVersion -gt $BaseVersion) {
              $BaseVersion = $TaggedVersion
            }
          }

          $ReleaseVersion = "$($BaseVersion.Major).$($BaseVersion.Minor).$($BaseVersion.Build + 1)"
          Write-Host "Próxima versão: $ReleaseVersion"

          $Config.version = $ReleaseVersion
          $Config | ConvertTo-Json -Depth 100 |
            Set-Content $ConfigPath -Encoding utf8

          $Package = Get-Content $PackagePath -Raw | ConvertFrom-Json
          $Package.version = $ReleaseVersion
          $Package | ConvertTo-Json -Depth 100 |
            Set-Content $PackagePath -Encoding utf8

          $PackageLock = Get-Content $PackageLockPath -Raw |
            ConvertFrom-Json -AsHashtable
          $PackageLock.version = $ReleaseVersion
          $PackageLock.packages[""].version = $ReleaseVersion
          $PackageLock | ConvertTo-Json -Depth 100 |
            Set-Content $PackageLockPath -Encoding utf8

          $CargoPath = "desktop/src-tauri/Cargo.toml"
          $CargoContent = Get-Content $CargoPath -Raw
          $CargoContent = $CargoContent -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$ReleaseVersion`""
          Set-Content $CargoPath $CargoContent -NoNewline -Encoding utf8

          $CargoLockPath = "desktop/src-tauri/Cargo.lock"
          $CargoLockContent = Get-Content $CargoLockPath -Raw
          $CargoLockContent = [regex]::Replace(
            $CargoLockContent,
            '(?s)(\[\[package\]\]\r?\nname = "desktop"\r?\nversion = ")[^"]+(")',
            ('$1' + $ReleaseVersion + '$2'),
            1
          )
          Set-Content $CargoLockPath $CargoLockContent -NoNewline -Encoding utf8

      # ======================================
      # 7. NODE.JS
      # ======================================

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # ======================================
      # 8. VALIDAR VERSÕES
      # ======================================

      - name: Validate application versions
        shell: pwsh
        run: |
          $Tauri = Get-Content "desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json

          $Package = Get-Content "desktop/package.json" -Raw | ConvertFrom-Json

          $PackageLock = Get-Content "desktop/package-lock.json" -Raw | ConvertFrom-Json -AsHashtable

          $CargoContent = Get-Content "desktop/src-tauri/Cargo.toml" -Raw

          if ($CargoContent -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Não foi possível identificar a versão do Cargo.toml."
          }

          $CargoVersion = $Matches[1]
          $PackageLockVersion = $PackageLock.packages[''].version

          $Versions = @(
            $Tauri.version,
            $CargoVersion,
            $Package.version,
            $PackageLockVersion
          )

          Write-Host "======================================"
          Write-Host " VALIDANDO VERSÕES"
          Write-Host "======================================"

          Write-Host "Tauri: $($Tauri.version)"
          Write-Host "Cargo: $CargoVersion"
          Write-Host "Package: $($Package.version)"
          Write-Host "Package Lock: $PackageLockVersion"

          $UniqueVersions = @($Versions | Select-Object -Unique)

          if ($UniqueVersions.Count -ne 1) {
            throw "As versões estão divergentes. Build cancelado."
          }

          Write-Host ""
          Write-Host "Todas as versões estão sincronizadas: $($Tauri.version)"

      # ======================================
      # 9. RUST
      # ======================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ======================================
      # 10. BUILD E PUBLICAÇÃO
      # ======================================

      - name: Validate updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Configure o secret TAURI_SIGNING_PRIVATE_KEY para assinar as atualizações."
          }

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          projectPath: desktop

          tagName: app-v__VERSION__

          releaseName: Claude Audiencia v__VERSION__

          releaseBody: |
            Nova versão do Claude Audiência para Windows.

            Baixe o instalador NSIS para instalar ou atualizar o aplicativo.

          releaseDraft: false
          prerelease: false

          args: --bundles nsis
